name: Build debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # JDK задан числом намеренно: latest и автоопределение ломают сборку
      # задним числом. 17 — та версия, на которой собирается сам Readium 3.3.0
      # с этой же связкой AGP 9.0.0 / Gradle 9.1.0.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Стороннее действие для SDK не используем: android-actions/setup-android
      # тянет давно удалённый пакет tools и падает. На раннере Android SDK уже
      # стоит, нужна только платформа 37.
      - name: Install Android platform 36
        run: |
          set -eu
          SDKMANAGER=$(ls "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36"

      # Версию Gradle задаёт только wrapper: gradle/wrapper/gradle-wrapper.properties
      # закоммичен, distributionUrl указывает точную версию, distributionSha256Sum
      # проверяет дистрибутив. Здесь версия не переопределяется.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # Кеш зависимостей и build cache. В main пишем, в PR только читаем.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bibliarium-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
